<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оформлення замовлення | ВІСК</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Перейти до основного контенту</a>
  <header class="site-header">
    <div class="container site-header__inner">
      <a href="/" class="logo">ВІСК</a>
      <div class="header-actions">
        <a href="/cart.html" class="cart-link">Кошик <span data-cart-count></span></a>
      </div>
    </div>
  </header>

  <main id="main-content" class="container section" style="max-width:640px;">
    <h1>Оформлення замовлення</h1>
    <div id="checkout-root" aria-live="polite"></div>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>Оплата онлайн поки не підключена. Після оформлення ми зв'яжемось із вами телефоном або email, щоб узгодити спосіб оплати й доставку.</p>
    </div>
  </footer>

  <script src="/js/products-data.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/main.js"></script>
  <script>
    function renderCheckout() {
      const root = document.getElementById("checkout-root");
      const lines = cartLines();

      if (lines.length === 0) {
        root.innerHTML = `<div class="empty-state"><p>Кошик порожній.</p><p><a href="/#catalog" class="btn">У каталог</a></p></div>`;
        return;
      }

      const linesHtml = lines
        .map((l) => `<div class="cart-summary__row"><span>${l.product.name} (${l.variant.label}) × ${l.qty}</span><span>${formatUAH(l.lineTotal)}</span></div>`)
        .join("");

      root.innerHTML = `
        <div style="margin-bottom:20px;">${linesHtml}</div>
        <p><strong>Орієнтовна сума: ${formatUAH(cartTotal())}</strong></p>
        <form id="checkout-form">
          <div class="form-grid">
            <div class="field full">
              <label for="name">Ім'я та прізвище</label>
              <input type="text" id="name" name="name" autocomplete="name" required>
            </div>
            <div class="field">
              <label for="phone">Телефон</label>
              <input type="tel" id="phone" name="phone" autocomplete="tel" required>
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="field full">
              <label for="address">Адреса доставки / відділення Нової пошти</label>
              <textarea id="address" name="address" autocomplete="street-address" rows="3" required></textarea>
            </div>
          </div>
          <button type="submit" class="btn btn--full" id="pay-btn">Надіслати замовлення</button>
          <p class="checkout-note" id="checkout-error" role="alert" style="color:var(--error);"></p>
        </form>`;

      document.getElementById("checkout-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById("pay-btn");
        const errorEl = document.getElementById("checkout-error");
        submitBtn.disabled = true;
        submitBtn.textContent = "Надсилаємо…";
        errorEl.textContent = "";

        const orderId = "order-" + Date.now();
        const items = lines.map((l) => ({
          name: l.product.name,
          variant: l.variant.label,
          qty: l.qty,
          price: l.variant.price,
        }));

        try {
          const res = await fetch("/.netlify/functions/send-order", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              orderId,
              amount: cartTotal(),
              items,
              customer: {
                name: document.getElementById("name").value,
                phone: document.getElementById("phone").value,
                email: document.getElementById("email").value,
                address: document.getElementById("address").value,
              },
            }),
          });

          if (!res.ok) throw new Error("Сервер недоступний");

          localStorage.removeItem("visk_cart");
          window.location.href = "/success.html";
        } catch (err) {
          errorEl.textContent = "Не вдалося надіслати замовлення. Спробуйте ще раз або зателефонуйте нам напряму.";
          submitBtn.disabled = false;
          submitBtn.textContent = "Надіслати замовлення";
        }
      });
    }

    document.addEventListener("DOMContentLoaded", renderCheckout);
  </script>
</body>
</html>
